apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentic-sdlc
  namespace: agentic-sdlc
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agentic-sdlc.example.com
      secretName: agentic-sdlc-tls
  rules:
    - host: agentic-sdlc.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentic-sdlc
                port:
                  number: 80
