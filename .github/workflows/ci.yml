name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/agentic-sdlc

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Static Analysis
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install mypy
        run: pip install mypy==1.10.0

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true


  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Unit & System Tests
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Run system tests
        run: python run_tests.py

      - name: Run pytest with coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --tb=short

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false


  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: End-to-End Agentic Workflow
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mandatory URL shortener use case
        run: |
          python main.py --auto \
            --requirement "Build a scalable URL shortener service with APIs, persistence, and analytics." \
            --output-dir /tmp/e2e_outputs

      - name: Validate generated artifacts
        run: |
          python - <<'EOF'
          import os
          import json

          output_dir = "/tmp/e2e_outputs"

          runs = [
              d for d in os.listdir(output_dir)
              if d.startswith("run_")
          ]

          assert runs, "No run directory found"

          run_dir = os.path.join(output_dir, runs[0])

          summary_path = os.path.join(
              run_dir,
              "workflow_summary.json"
          )

          assert os.path.exists(summary_path), \
              "workflow_summary.json missing"

          with open(summary_path) as f:
              summary = json.load(f)

          assert summary["scenario"] == "greenfield"

          assert summary["validation"]["passed"] is True

          failed = [
              task for task in summary["tasks"]
              if task["status"] == "failed"
          ]

          assert not failed, \
              f"Failed tasks: {failed}"

          code_dir = os.path.join(
              run_dir,
              "code_generation",
              "app"
          )

          for filename in [
              "main.py",
              "service.py",
              "routes.py",
              "models.py",
              "repository.py",
          ]:
              assert os.path.exists(
                  os.path.join(code_dir, filename)
              ), f"Missing generated file: {filename}"

          test_dir = os.path.join(
              run_dir,
              "test_generation",
              "tests"
          )

          assert os.path.exists(
              os.path.join(
                  test_dir,
                  "unit",
                  "test_service.py"
              )
          )

          assert os.path.exists(
              os.path.join(
                  test_dir,
                  "integration",
                  "test_api.py"
              )
          )

          doc_dir = os.path.join(
              run_dir,
              "documentation"
          )

          for filename in [
              "README.md",
              "ENGINEERING_SUMMARY.md",
              "RUNBOOK.md",
          ]:
              assert os.path.exists(
                  os.path.join(doc_dir, filename)
              ), f"Missing documentation: {filename}"

          print("E2E validation passed.")

          EOF

      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-outputs
          path: /tmp/e2e_outputs/
          retention-days: 7


  # ───────────────────────────────────────────────────────────────────────────
  # Job 4: Build & Push Docker Image
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: e2e

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
