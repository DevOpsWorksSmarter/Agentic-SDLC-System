name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install mypy
        run: |
          pip install mypy==1.10.0

      - name: Run mypy
        run: |
          mypy src/ --ignore-missing-imports
        continue-on-error: true

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run system tests
        env:
          PYTHONPATH: .
        run: |
          python run_tests.py

      - name: Run pytest with coverage
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --tb=short

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  e2e:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mandatory URL shortener use case
        env:
          PYTHONPATH: .
        run: |
          python main.py --auto \
            --requirement "Build a scalable URL shortener service with APIs, persistence, and analytics." \
            --output-dir /tmp/e2e_outputs

      - name: Validate generated artifacts
        run: |
          python - <<'EOF'
          import json
          import os
          import sys

          output_dir = "/tmp/e2e_outputs"

          assert os.path.exists(output_dir), \
              "E2E output directory was not created"

          runs = [
              d for d in os.listdir(output_dir)
              if d.startswith("run_")
          ]

          assert runs, "No run directory found"

          run_dir = os.path.join(output_dir, sorted(runs)[-1])

          print(f"Validating run directory: {run_dir}")

          summary_path = os.path.join(
              run_dir,
              "workflow_summary.json"
          )

          assert os.path.exists(summary_path), \
              "workflow_summary.json missing"

          with open(summary_path, encoding="utf-8") as f:
              summary = json.load(f)

          assert summary["scenario"] == "greenfield", \
              f"Unexpected scenario: {summary.get('scenario')}"

          assert summary["validation"]["passed"] is True, \
              "Workflow validation did not pass"

          failed = [
              task
              for task in summary.get("tasks", [])
              if task.get("status") == "failed"
          ]

          assert not failed, \
              f"Failed tasks detected: {failed}"

          code_dir = os.path.join(
              run_dir,
              "code_generation",
              "app"
          )

          required_code_files = [
              "main.py",
              "service.py",
              "routes.py",
              "models.py",
              "repository.py",
          ]

          for filename in required_code_files:
              path = os.path.join(code_dir, filename)
              assert os.path.exists(path), \
                  f"Missing generated file: {filename}"

          test_dir = os.path.join(
              run_dir,
              "test_generation",
              "tests"
          )

          required_test_files = [
              os.path.join("unit", "test_service.py"),
              os.path.join("integration", "test_api.py"),
          ]

          for filename in required_test_files:
              path = os.path.join(test_dir, filename)
              assert os.path.exists(path), \
                  f"Missing generated test: {filename}"

          doc_dir = os.path.join(
              run_dir,
              "documentation"
          )

          required_docs = [
              "README.md",
              "ENGINEERING_SUMMARY.md",
              "RUNBOOK.md",
          ]

          for filename in required_docs:
              path = os.path.join(doc_dir, filename)
              assert os.path.exists(path), \
                  f"Missing documentation: {filename}"

          print("E2E validation passed.")
          print(f"Validated run: {run_dir}")
          EOF

      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-outputs
          path: /tmp/e2e_outputs/
          retention-days: 7

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: e2e

    if: >
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          IMAGE_NAME=$(echo "${GITHUB_REPOSITORY}/agentic-sdlc" | tr '[:upper:]' '[:lower:]')

          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

          echo "Docker image:"
          echo "ghcr.io/${IMAGE_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
