name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/agentic-sdlc

jobs:
  # ── Deploy to Staging ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
      url: https://staging.agentic-sdlc.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubeconfig (staging)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config

      - name: Set image tag
        id: tag
        run: echo "tag=sha-$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Deploy to staging namespace
        run: |
          kubectl set image deployment/agentic-sdlc \
            agentic-sdlc=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            -n staging
          kubectl rollout status deployment/agentic-sdlc -n staging --timeout=120s

      - name: Run smoke test against staging
        run: |
          STAGING_URL="https://staging.agentic-sdlc.example.com"
          # Health check
          curl -sf "$STAGING_URL/health" | grep '"status":"ok"'
          echo "Staging smoke test passed"

  # ── Approval Gate ──────────────────────────────────────────────────────────
  approve-production:
    name: Approve Production Deployment
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production-approval  # Requires manual approval in GitHub Environments

    steps:
      - name: Approval checkpoint
        run: echo "Production deployment approved by ${{ github.actor }}"

  # ── Deploy to Production ───────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: approve-production
    environment:
      name: production
      url: https://agentic-sdlc.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubeconfig (production)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config

      - name: Set image tag
        id: tag
        run: echo "tag=sha-$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Rolling deploy to production
        run: |
          kubectl set image deployment/agentic-sdlc \
            agentic-sdlc=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            -n production
          kubectl rollout status deployment/agentic-sdlc -n production --timeout=300s

      - name: Verify production health
        run: |
          PROD_URL="https://agentic-sdlc.example.com"
          for i in 1 2 3; do
            if curl -sf "$PROD_URL/health" | grep '"status":"ok"'; then
              echo "Production health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Production health check failed — triggering rollback"
          kubectl rollout undo deployment/agentic-sdlc -n production
          exit 1

      - name: Tag release
        run: |
          git tag "release-$(date +%Y%m%d-%H%M%S)-${{ steps.tag.outputs.tag }}"
          git push origin --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
