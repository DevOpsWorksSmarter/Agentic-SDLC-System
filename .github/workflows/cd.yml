name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:

  # ============================================================
  # STAGING DEPLOYMENT
  # ============================================================

  deploy-staging:
    name: Deploy to Ephemeral Staging

    if: >
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:

      # ----------------------------------------------------------
      # Checkout exact commit that triggered CI
      # ----------------------------------------------------------

      - name: Checkout exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ----------------------------------------------------------
      # Determine exact image produced by CI
      # ----------------------------------------------------------

      - name: Set image information
        id: image
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          SHORT_SHA="${HEAD_SHA:0:7}"

          # GHCR repository names must be lowercase.
          IMAGE_NAME=$(echo "${REPOSITORY}/agentic-sdlc" | tr '[:upper:]' '[:lower:]')

          IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-${SHORT_SHA}"

          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Deployment image:"
          echo "${IMAGE}"
          echo "========================================"

      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Pull exact image produced by CI
      # ----------------------------------------------------------

      - name: Pull exact CI image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.image.outputs.image }}"

          echo "Pulling:"
          echo "${IMAGE}"

          docker pull "${IMAGE}"

      # ----------------------------------------------------------
      # Create ephemeral Kind staging cluster
      # ----------------------------------------------------------

      - name: Create Kind staging cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: agentic-sdlc-staging
          node_image: kindest/node:v1.29.2

      # ----------------------------------------------------------
      # Verify Kubernetes cluster
      # ----------------------------------------------------------

      - name: Verify staging cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ----------------------------------------------------------
      # Load exact application image into Kind
      # ----------------------------------------------------------

      - name: Load application image into Kind
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.image.outputs.image }}"

          kind load docker-image "${IMAGE}" \
            --name agentic-sdlc-staging

      # ----------------------------------------------------------
      # Create staging namespace
      # ----------------------------------------------------------

      - name: Create staging namespace
        run: |
          kubectl create namespace staging

      # ----------------------------------------------------------
      # Deploy application to staging
      # ----------------------------------------------------------

      - name: Deploy application to staging
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: agentic-sdlc
            namespace: staging
            labels:
              app: agentic-sdlc
              environment: staging
          spec:
            replicas: 1
            revisionHistoryLimit: 3
            selector:
              matchLabels:
                app: agentic-sdlc
            template:
              metadata:
                labels:
                  app: agentic-sdlc
                  environment: staging
              spec:
                containers:
                  - name: agentic-sdlc
                    image: ${IMAGE}
                    imagePullPolicy: Never
                    ports:
                      - name: http
                        containerPort: 8080
                        protocol: TCP

                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      timeoutSeconds: 5
                      failureThreshold: 12

                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 8080
                      initialDelaySeconds: 20
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 6

                    resources:
                      requests:
                        cpu: "100m"
                        memory: "128Mi"
                      limits:
                        cpu: "500m"
                        memory: "512Mi"

          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: agentic-sdlc
            namespace: staging
            labels:
              app: agentic-sdlc
          spec:
            selector:
              app: agentic-sdlc
            ports:
              - name: http
                port: 8080
                targetPort: 8080
                protocol: TCP
            type: ClusterIP
          EOF

      # ----------------------------------------------------------
      # Wait for staging rollout
      # ----------------------------------------------------------

      - name: Wait for staging rollout
        run: |
          kubectl rollout status deployment/agentic-sdlc \
            -n staging \
            --timeout=180s

      # ----------------------------------------------------------
      # Show staging resources
      # ----------------------------------------------------------

      - name: Show staging resources
        if: always()
        run: |
          kubectl get pods -n staging -o wide || true
          kubectl get svc -n staging || true
          kubectl get deployment -n staging || true

      # ----------------------------------------------------------
      # Show staging logs
      # ----------------------------------------------------------

      - name: Show staging logs
        if: always()
        run: |
          kubectl logs \
            -n staging \
            deployment/agentic-sdlc \
            --tail=100 || true

      # ----------------------------------------------------------
      # Port forward staging service
      # ----------------------------------------------------------

      - name: Port forward staging service
        shell: bash
        run: |
          set -euo pipefail

          kubectl port-forward \
            -n staging \
            service/agentic-sdlc \
            8080:8080 \
            > /tmp/staging-port-forward.log 2>&1 &

          echo $! > /tmp/staging-port-forward.pid

          sleep 5

      # ----------------------------------------------------------
      # Staging health check
      # ----------------------------------------------------------

      - name: Run staging health check
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking staging health endpoint..."

          for i in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8080/health; then

              echo
              echo "Staging health check passed."
              exit 0
            fi

            echo "Health check attempt ${i}/12 failed."
            sleep 5
          done

          echo "Staging health check failed."

          cat /tmp/staging-port-forward.log || true

          kubectl get pods -n staging -o wide || true
          kubectl describe pods -n staging || true
          kubectl logs deployment/agentic-sdlc \
            -n staging \
            --tail=200 || true

          exit 1

      # ----------------------------------------------------------
      # Cleanup staging port forward
      # ----------------------------------------------------------

      - name: Cleanup staging port forward
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/staging-port-forward.pid ]; then
            kill "$(cat /tmp/staging-port-forward.pid)" || true
          fi

      # ----------------------------------------------------------
      # Destroy staging cluster
      # ----------------------------------------------------------

      - name: Delete staging cluster
        if: always()
        run: |
          kind delete cluster \
            --name agentic-sdlc-staging || true


  # ============================================================
  # PRODUCTION DEPLOYMENT
  # ============================================================

  deploy-production:
    name: Deploy to Ephemeral Production

    needs:
      - deploy-staging

    if: >
      needs.deploy-staging.result == 'success' &&
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:

      # ----------------------------------------------------------
      # Checkout exact commit that triggered CI
      # ----------------------------------------------------------

      - name: Checkout exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ----------------------------------------------------------
      # Determine exact image produced by CI
      # ----------------------------------------------------------

      - name: Set image information
        id: image
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          SHORT_SHA="${HEAD_SHA:0:7}"

          # GHCR repository names must be lowercase.
          IMAGE_NAME=$(echo "${REPOSITORY}/agentic-sdlc" | tr '[:upper:]' '[:lower:]')

          IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-${SHORT_SHA}"

          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Production image:"
          echo "${IMAGE}"
          echo "========================================"

      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Pull exact image produced by CI
      # ----------------------------------------------------------

      - name: Pull exact CI image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.image.outputs.image }}"

          echo "Pulling:"
          echo "${IMAGE}"

          docker pull "${IMAGE}"

      # ----------------------------------------------------------
      # Create ephemeral Kind production cluster
      # ----------------------------------------------------------

      - name: Create Kind production cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: agentic-sdlc-production
          node_image: kindest/node:v1.29.2

      # ----------------------------------------------------------
      # Verify Kubernetes cluster
      # ----------------------------------------------------------

      - name: Verify production cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ----------------------------------------------------------
      # Load exact application image into Kind
      # ----------------------------------------------------------

      - name: Load application image into Kind
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.image.outputs.image }}"

          kind load docker-image "${IMAGE}" \
            --name agentic-sdlc-production

      # ----------------------------------------------------------
      # Create production namespace
      # ----------------------------------------------------------

      - name: Create production namespace
        run: |
          kubectl create namespace production

      # ----------------------------------------------------------
      # Deploy application to production
      # ----------------------------------------------------------

      - name: Deploy application to production
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: agentic-sdlc
            namespace: production
            labels:
              app: agentic-sdlc
              environment: production
          spec:
            replicas: 1
            revisionHistoryLimit: 3
            selector:
              matchLabels:
                app: agentic-sdlc
            template:
              metadata:
                labels:
                  app: agentic-sdlc
                  environment: production
              spec:
                containers:
                  - name: agentic-sdlc
                    image: ${IMAGE}
                    imagePullPolicy: Never
                    ports:
                      - name: http
                        containerPort: 8080
                        protocol: TCP

                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      timeoutSeconds: 5
                      failureThreshold: 12

                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 8080
                      initialDelaySeconds: 20
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 6

                    resources:
                      requests:
                        cpu: "100m"
                        memory: "128Mi"
                      limits:
                        cpu: "500m"
                        memory: "512Mi"

          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: agentic-sdlc
            namespace: production
            labels:
              app: agentic-sdlc
          spec:
            selector:
              app: agentic-sdlc
            ports:
              - name: http
                port: 8080
                targetPort: 8080
                protocol: TCP
            type: ClusterIP
          EOF

      # ----------------------------------------------------------
      # Wait for production rollout
      # ----------------------------------------------------------

      - name: Wait for production rollout
        run: |
          kubectl rollout status deployment/agentic-sdlc \
            -n production \
            --timeout=180s

      # ----------------------------------------------------------
      # Show production resources
      # ----------------------------------------------------------

      - name: Show production resources
        if: always()
        run: |
          kubectl get pods -n production -o wide || true
          kubectl get svc -n production || true
          kubectl get deployment -n production || true

      # ----------------------------------------------------------
      # Show production logs
      # ----------------------------------------------------------

      - name: Show production logs
        if: always()
        run: |
          kubectl logs \
            -n production \
            deployment/agentic-sdlc \
            --tail=100 || true

      # ----------------------------------------------------------
      # Production health check
      # ----------------------------------------------------------

      - name: Run production health check
        shell: bash
        run: |
          set -euo pipefail

          kubectl port-forward \
            -n production \
            service/agentic-sdlc \
            8080:8080 \
            > /tmp/production-port-forward.log 2>&1 &

          PORT_FORWARD_PID=$!

          cleanup() {
            kill "$PORT_FORWARD_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "Waiting for production application..."

          HEALTHY=false

          for i in {1..12}; do
            if RESPONSE=$(curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8080/health); then

              echo "Health response:"
              echo "$RESPONSE"

              if echo "$RESPONSE" | grep -q '"status":"ok"'; then
                HEALTHY=true

                echo
                echo "Production health check passed."

                break
              fi
            fi

            echo "Health check attempt ${i}/12 failed."
            sleep 5
          done

          if [ "$HEALTHY" != "true" ]; then

            echo "Production health check failed."

            cat /tmp/production-port-forward.log || true

            kubectl get pods -n production -o wide || true

            kubectl describe pods -n production || true

            kubectl logs deployment/agentic-sdlc \
              -n production \
              --tail=200 || true

            exit 1
          fi

      # ----------------------------------------------------------
      # Create deployment summary
      # ----------------------------------------------------------

      - name: Create deployment summary
        if: success()
        shell: bash
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Agentic SDLC Deployment Successful

          ### Deployment Information

          | Environment | Status |
          |---|---|
          | Staging | ✅ Passed |
          | Production | ✅ Passed |

          ### Image

          \`${{ steps.image.outputs.image }}\`

          ### Commit

          \`${{ steps.image.outputs.head_sha }}\`

          ### Health Checks

          - Staging: `/health` ✅
          - Production: `/health` ✅

          ### Deployment Model

          - Kubernetes: Kind
          - Staging cluster: ephemeral
          - Production cluster: ephemeral
          - External kubeconfig: Not required
          - External infrastructure: Not required

          EOF

      # ----------------------------------------------------------
      # Create release tag
      # ----------------------------------------------------------

      - name: Tag release
        if: success()
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${HEAD_SHA:0:7}"

          TAG="release-$(date +%Y%m%d-%H%M%S)-sha-${SHORT_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

          echo "========================================"
          echo "Release created:"
          echo "$TAG"
          echo "========================================"

      # ----------------------------------------------------------
      # Destroy production cluster
      # ----------------------------------------------------------

      - name: Delete production cluster
        if: always()
        run: |
          kind delete cluster \
            --name agentic-sdlc-production || true
