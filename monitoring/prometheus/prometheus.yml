global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: agentic-sdlc

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: agentic-sdlc
    static_configs:
      - targets: [agentic-sdlc:8080]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
